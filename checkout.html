<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="checkout-wrapper">

    <!-- LEFT : FORM -->
    <div class="checkout-left">
      <h2>Delivery Details</h2>

      <form id="checkoutForm">

        <label>Full Name</label>
        <input id="custName" type="text" placeholder="Enter your name">

        <label>Phone Number</label>
        <input id="custPhone" type="text" placeholder="Enter phone number">

        <label>Delivery Address</label>
        <textarea id="custAddress" placeholder="Complete address"></textarea>

        <label>Payment Method</label>
        <div class="payment-options">
          <label><input type="radio" name="pay" value="cod" checked> Cash on Delivery</label>
          <label><input type="radio" name="pay" value="upi"> UPI</label>
          <label><input type="radio" name="pay" value="card"> Debit/Credit Card</label>
        </div>

        <button class="place-order-btn">Place Order</button>
      </form>
    </div>

    <!-- RIGHT : ORDER SUMMARY -->
    <div class="checkout-right">
      <h2>Order Summary</h2>
      <div id="orderSummary"></div>
    </div>

  </div>

  <script src="checkout.js"></script>
  <script src="cart.js"></script> <!-- your existing cart functions -->
</body>
</html>
